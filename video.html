<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sporkent Asistan · Video</title>
  <meta name="theme-color" content="#2b6f93">
  <link rel="icon" href="icons/sk-mavi-192.png">
  <meta property="og:title" content="Sporkent Asistan · Video">
  <meta property="og:description" content="Sporkent Asistan programının kurulum ve tanıtım videoları">
  <meta property="og:image" content="https://avsamimciftci-wq.github.io/sporkent-saha-takip/video/tanitim.jpg">
  <style>
    :root { --zemin: #f3f5f4; --kart: #fff; --yazi: #1d2b26; --soluk: #5b6b66; --cizgi: #d8e0dd; --mavi: #2b6f93; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --zemin: #101a17; --kart: #1a2622; --yazi: #e9f0ed; --soluk: #a6b5b0; --cizgi: #2c3b36; }
    }
    :root[data-theme="dark"] { --zemin: #101a17; --kart: #1a2622; --yazi: #e9f0ed; --soluk: #a6b5b0; --cizgi: #2c3b36; }
    * { box-sizing: border-box; }
    /* Sayfa telefonun ekranına tam sığar: video kalan alana küçülür, düğmeler hep görünür */
    html, body { height: 100%; }
    body { margin: 0; background: var(--zemin); color: var(--yazi); font: 17px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
    header { flex: none; background: var(--mavi); padding: calc(6px + env(safe-area-inset-top)) 16px 6px; text-align: center; }
    header img { height: clamp(36px, 7dvh, 60px); max-width: 100%; object-fit: contain; display: block; margin: 0 auto; }
    main { flex: 1; min-height: 0; width: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column;
      padding: clamp(6px, 1.5dvh, 14px) 16px calc(clamp(8px, 2dvh, 18px) + env(safe-area-inset-bottom)); gap: clamp(4px, 1.2dvh, 10px); }
    h1 { flex: none; font-size: clamp(18px, 3dvh, 24px); margin: 0; text-align: center; }
    .alt { flex: none; color: var(--soluk); text-align: center; margin: 0; font-size: clamp(13px, 2dvh, 16px); }
    .sekmeler { flex: none; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .sekmeler[hidden] { display: none; }
    .sekmeler button { font: inherit; font-size: clamp(14px, 2.2dvh, 17px); font-weight: 800; padding: clamp(6px, 1.2dvh, 12px) 8px; border-radius: 12px; border: 2px solid var(--cizgi); background: var(--kart); color: var(--yazi); cursor: pointer; }
    .sekmeler button.secili { background: var(--mavi); border-color: var(--mavi); color: #fff; }
    .video-alan { flex: 1; min-height: 120px; display: flex; justify-content: center; align-items: center; }
    video { display: block; height: 100%; max-width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.18); object-fit: contain; }
    .ipucu { flex: none; color: var(--soluk); font-size: clamp(12px, 1.8dvh, 15px); text-align: center; margin: 0; }
    .dugme { flex: none; display: block; padding: clamp(10px, 1.8dvh, 16px); border-radius: 14px; background: #1f5145; color: #fff; text-align: center; text-decoration: none; font-weight: 800; font-size: clamp(16px, 2.5dvh, 19px); }
    .diger { flex: none; display: block; text-align: center; color: var(--mavi); font-weight: 700; font-size: clamp(14px, 2.2dvh, 17px); }
    /* Çok kısa ekranlarda (yatay telefon) açıklama satırları gizlenir */
    @media (max-height: 520px) { .alt, .ipucu { display: none; } header img { height: 32px; } }
  </style>
</head>
<body>
  <header><img src="logo-yatay.png" alt="Sporkent Asistan"></header>
  <main>
    <h1 id="baslik">Sporkent Asistan</h1>
    <p class="alt" id="alt"></p>
    <div class="sekmeler" id="sekmeler" hidden>
      <button type="button" data-cihaz="android">🤖 Android</button>
      <button type="button" data-cihaz="iphone">🍏 iPhone</button>
    </div>
    <div class="video-alan"><video id="video" controls playsinline preload="metadata"></video></div>
    <p class="ipucu">▶ Videoya dokunun · Büyütmek için ⛶ işaretine dokunun</p>
    <a class="dugme" id="kur" href="./">📲 Programı açmak / kurmak için dokunun</a>
    <a class="diger" id="diger" href="#"></a>
  </main>
  <script>
    const p = new URLSearchParams(location.search);
    const tg = p.has("tg");
    const tur = p.get("v") === "tanitim" ? "tanitim" : "kurulum";
    const ios = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    let cihaz = p.get("cihaz") === "iphone" || (!p.get("cihaz") && ios) ? "iphone" : "android";
    const v = document.getElementById("video");
    const ek = tg ? "&tg=1" : "";
    document.getElementById("kur").href = tg ? "./?giris=tg" : "./";
    function goster() {
      if (tur === "tanitim") {
        document.getElementById("baslik").textContent = "Programın tanıtımı";
        document.getElementById("alt").textContent = "Sporkent Asistan programında neler var? (3,5 dakika)";
        v.poster = "video/tanitim.jpg"; v.src = "video/tanitim.mp4";
        const d = document.getElementById("diger"); d.textContent = "📲 Kurulum videosunu izleyin ›"; d.href = "?v=kurulum" + ek;
      } else {
        document.getElementById("baslik").textContent = "Program nasıl kurulur?";
        document.getElementById("alt").textContent = cihaz === "iphone" ? "iPhone için kurulum (1,5 dakika)" : "Android telefon için kurulum (1 dakika)";
        document.getElementById("sekmeler").hidden = false;
        for (const b of document.querySelectorAll("[data-cihaz]")) b.classList.toggle("secili", b.dataset.cihaz === cihaz);
        v.poster = `video/kurulum-${cihaz}.jpg`; v.src = `video/kurulum-${cihaz}.mp4`;
        const d = document.getElementById("diger"); d.textContent = "🎬 Programın tanıtım videosunu izleyin ›"; d.href = "?v=tanitim" + ek;
      }
    }
    document.getElementById("sekmeler").addEventListener("click", (e) => {
      const b = e.target.closest("[data-cihaz]"); if (!b) return;
      cihaz = b.dataset.cihaz; goster(); v.play().catch(() => {});
    });
    goster();
  </script>
</body>
</html>
