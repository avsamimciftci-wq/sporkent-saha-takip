<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sporkent Takip</title>
  <meta name="theme-color" content="#1f4e45">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sporkent Takip">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="ust">
    <div>
      <div class="ust-kurum">Sporkent İşletme Kooperatifi</div>
      <div class="ust-baslik">Saha Takip</div>
    </div>
    <button id="cikis" class="ust-dugme" hidden>Çıkış</button>
  </header>

  <div id="demo-uyari" class="demo" hidden>
    Deneme modu: kayıtlar yalnızca bu cihazda tutulur.
  </div>

  <!-- Giriş -->
  <main id="ekran-giris" class="ekran" hidden>
    <form id="giris-form" class="kart">
      <h1>Giriş</h1>
      <label>Adınız
        <input name="ad" autocomplete="name" required maxlength="80" placeholder="Örn. Ahmet Yılmaz">
      </label>
      <label>Giriş kodu
        <input name="kod" required autocomplete="off" autocapitalize="none" spellcheck="false">
      </label>
      <button class="ana-dugme" type="submit">Giriş yap</button>
      <p id="giris-hata" class="hata" hidden></p>
    </form>
  </main>

  <!-- Liste -->
  <main id="ekran-liste" class="ekran" hidden>
    <div id="ozet" class="ozet"></div>
    <p id="gorunurluk" class="ipucu" style="margin:-4px 0 12px"></p>
    <div id="bildirim-kutu" class="bilgi" hidden>
      <span id="bildirim-metin">Bildirimleri açın, yeni kayıt ve “yapıldı” haberleri telefonunuza gelsin.</span>
      <button id="bildirim-ac" class="kucuk-dugme">Bildirimleri aç</button>
    </div>
    <nav class="sekmeler" id="sekmeler">
      <button data-filtre="hepsi" class="secili">Tümü</button>
      <button data-filtre="acik">Açık</button>
      <button data-filtre="tamam">Yapılanlar</button>
    </nav>
    <div id="liste" class="liste"></div>
    <button id="bildirim-dene" class="ikincil" style="width:100%;margin-top:16px">🔔 Bildirimi dene</button>
    <button id="yeni-ac" class="yuzen">+ Yeni kayıt</button>
  </main>

  <!-- Yeni kayıt -->
  <main id="ekran-yeni" class="ekran" hidden>
    <form id="yeni-form" class="kart">
      <h1>Yeni kayıt</h1>

      <div class="foto-alan">
        <img id="yeni-foto-onizleme" alt="" hidden>
        <label class="foto-dugme">
          <input id="yeni-foto" type="file" accept="image/*" capture="environment" hidden>
          <span id="yeni-foto-yazi">📷 Fotoğraf çek</span>
        </label>
      </div>

      <label>Yer
        <input name="yer" required maxlength="200" placeholder="Örn. 3 numaralı duş">
      </label>

      <label>Sorun
        <div class="ses-satir">
          <textarea name="sorun" required rows="4" maxlength="2000" placeholder="Yazın ya da mikrofona basıp konuşun"></textarea>
          <button type="button" class="mikrofon" id="mikrofon" title="Sesle yaz">🎤</button>
        </div>
        <small id="mikrofon-ipucu" class="ipucu">Mikrofon çalışmazsa klavyedeki mikrofon tuşuyla da konuşarak yazabilirsiniz.</small>
      </label>

      <div class="dugmeler">
        <button type="button" class="ikincil" data-geri>Vazgeç</button>
        <button class="ana-dugme" type="submit">Gönder</button>
      </div>
      <p class="hata" hidden></p>
    </form>
  </main>

  <!-- Kayıt ayrıntısı -->
  <main id="ekran-detay" class="ekran" hidden>
    <div id="detay" class="kart"></div>
  </main>

  <div id="mesaj" class="mesaj" hidden></div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
